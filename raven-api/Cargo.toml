[package]
name = "raven-api"
version = "0.1.0"
edition = "2024"
description = "Unified HTTP API composition for Raven"

[dependencies]
anyhow = "1.0"
axum = "0.7"
health-engine = { path = "../health-engine" }
ledger-engine = { path = "../ledger-engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
todo-engine = { path = "../todo-engine" }
tracing = "0.1"
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
