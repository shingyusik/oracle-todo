[package]
name = "health-engine"
version = "0.1.0"
edition = "2024"
description = "Policy-enforced Raven Health Journal domain"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros", "parsing", "serde"] }
unicode-casefold = "0.2"
unicode-normalization = "0.1"
uuid = "1"
